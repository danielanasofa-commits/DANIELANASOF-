<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Fatura Pró-forma</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js" defer></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0f172a;
      --gold: #b8860b;
      --border: #e2e8f0;
      --bg-app: #f1f5f9;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--primary);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 850px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      margin-bottom: 50px;
    }

    /* Cabeçalho do Formulário */
    .form-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--gold);
    }

    .form-header h1 { font-size: 24px; font-weight: 900; }
    .form-header svg { color: var(--gold); }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64748b;
      margin: 30px 0 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }

    /* Campos em Coluna (Vertical) */
    .grid-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; font-weight: 700; color: #475569; }
    
    input, select {
      height: 45px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--gold); outline: none; }

    /* Tabela de Itens */
    .table-wrapper { margin-top: 20px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .items-manager { width: 100%; border-collapse: collapse; }
    .items-manager th { text-align: left; font-size: 11px; padding: 12px; background: #f8fafc; color: #64748b; }
    .items-manager td { padding: 12px; border-top: 1px solid var(--border); font-size: 14px; }

    .btn-row { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }
    .btn { padding: 14px 28px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; }
    .btn-add { background: var(--primary); color: white; }
    .btn-pdf { background: var(--gold); color: white; }

    /* --- Visualização do Papel --- */
    #preview-wrapper {
      background: #cbd5e1;
      padding: 60px 20px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #invoice-paper {
      width: 210mm;
      min-height: 297mm;
      background: white;
      padding: 25mm;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }

    .inv-header { display: flex; justify-content: space-between; margin-bottom: 50px; }
    .inv-client-box { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
      background: #f8fafc; padding: 25px; border-radius: 4px; margin-bottom: 40px;
    }

    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
    .inv-table th { border-bottom: 2px solid var(--primary); padding: 12px 8px; text-align: left; font-size: 11px; }
    .inv-table td { padding: 15px 8px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

    .inv-total {
      text-align: right; border-top: 2px solid var(--primary); padding-top: 20px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="form-header">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </svg>
    <h1>Gerador de Fatura Pró-forma</h1>
  </div>

  <h2 class="section-title">Dados do Documento</h2>
  <div class="grid-form">
    <div class="field-group"><label>Nº PRO-FORMA</label><input type="text" id="iNum" value="PRO-2026-001"></div>
    <div class="field-group"><label>DATA DE EMISSÃO</label><input type="date" id="iDate"></div>
    <div class="field-group">
      <label>MOEDA</label>
      <select id="iCurr">
        <option value="AOA">Kwanza (AOA)</option>
        <option value="USD">Dólar (USD)</option>
      </select>
    </div>
  </div>

  <h2 class="section-title">Dados do Emissor</h2>
  <div class="grid-form">
    <div class="field-group"><label>NOME DA EMPRESA</label><input type="text" id="sName" value="DANIELANASOFÁ - Interiores"></div>
    <div class="field-group"><label>NIF EMISSOR</label><input type="text" id="sNif" value="5001234567"></div>
    <div class="field-group"><label>IBAN PARA DEPÓSITO</label><input type="text" id="sIban" value="AO06 0000 0000 0000 0000 0000 0"></div>
  </div>

  <h2 class="section-title">Dados do Cliente</h2>
  <div class="grid-form">
    <div class="field-group"><label>NOME DO CLIENTE</label><input type="text" id="cName" placeholder="Entidade ou Nome Particular"></div>
    <div class="field-group"><label>NIF CLIENTE</label><input type="text" id="cNif" placeholder="Opcional"></div>
  </div>

  <h2 class="section-title">Itens e Serviços</h2>
  <div class="table-wrapper">
    <table class="items-manager">
      <thead><tr><th>Descrição</th><th width="70">Qtd</th><th width="120">P. Unitário</th><th width="40"></th></tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
  </div>

  <div class="btn-row">
    <button class="btn btn-add" id="btnAdd">+ Adicionar Item</button>
    <button class="btn btn-pdf" id="btnExport">Exportar para PDF</button>
  </div>
</div>

<div id="preview-wrapper">
  <div id="invoice-paper">
    <div class="inv-header">
      <div>
        <div id="p-sName" style="font-size: 22px; font-weight: 900;"></div>
        <div id="p-sNif" style="font-size: 13px; color: #64748b; margin-top: 5px;"></div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 10px; font-weight: 900; color: var(--gold); letter-spacing: 2px;">FATURA PRÓ-FORMA</div>
        <div id="p-iNum" style="font-size: 20px; font-weight: 700; margin-top: 5px;"></div>
        <div id="p-iDate" style="font-size: 13px; color: #64748b;"></div>
      </div>
    </div>

    <div class="inv-client-box">
      <div>
        <div style="font-size: 9px; font-weight: 700; color: #94a3b8; margin-bottom: 5px;">CLIENTE</div>
        <div id="p-cName" style="font-weight: 700; font-size: 15px;"></div>
        <div id="p-cNif" style="font-size: 13px;"></div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 9px; font-weight: 700; color: #94a3b8; margin-bottom: 5px;">PAGAMENTO (IBAN)</div>
        <div id="p-sIban" style="font-family: monospace; font-size: 12px; color: var(--gold);"></div>
      </div>
    </div>

    <table class="inv-table">
      <thead><tr><th>DESCRIÇÃO</th><th style="text-align:center">QTD</th><th style="text-align:right">UNITÁRIO</th><th style="text-align:right">TOTAL</th></tr></thead>
      <tbody id="p-items"></tbody>
    </table>

    <div class="inv-total">
      <div style="font-size: 12px; font-weight: 600;">TOTAL A PAGAR</div>
      <div id="p-total" style="font-size: 32px; font-weight: 900;"></div>
      <div style="margin-top: 50px; font-size: 11px; color: #94a3b8; text-align: center;">
        Este documento não tem valor de fatura fiscal. Válido por 30 dias.
      </div>
    </div>
  </div>
</div>

<script>
// Aguarda o carregamento do DOM para evitar erros de referência
document.addEventListener('DOMContentLoaded', () => {
    let items = [];
    document.getElementById('iDate').valueAsDate = new Date();

    const sync = () => {
        // Sincronizar Textos
        const fields = ['sName', 'sNif', 'iNum', 'iDate', 'cName', 'cNif', 'sIban'];
        fields.forEach(f => {
            let val = document.getElementById(f).value;
            if(f === 'iDate' && val) val = new Date(val).toLocaleDateString('pt-AO');
            document.getElementById('p-' + f).innerText = val || '---';
        });

        // Sincronizar Tabelas
        const tbodyEdit = document.getElementById('itemsBody');
        const tbodyPrev = document.getElementById('p-items');
        tbodyEdit.innerHTML = '';
        tbodyPrev.innerHTML = '';
        
        let totalGeral = 0;
        const curr = document.getElementById('iCurr').value;

        items.forEach((item, idx) => {
            const sub = item.qty * item.price;
            totalGeral += sub;
            
            // Tabela de Edição
            const trEdit = document.createElement('tr');
            trEdit.innerHTML = `<td>${item.desc}</td><td>${item.qty}</td><td>${item.price.toLocaleString()}</td><td style="text-align:center"><button style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">×</button></td>`;
            trEdit.querySelector('button').onclick = () => { items.splice(idx, 1); sync(); };
            tbodyEdit.appendChild(trEdit);

            // Tabela Preview
            tbodyPrev.innerHTML += `<tr><td>${item.desc}</td><td style="text-align:center">${item.qty}</td><td style="text-align:right">${item.price.toLocaleString()}</td><td style="text-align:right; font-weight:700">${sub.toLocaleString()}</td></tr>`;
        });

        document.getElementById('p-total').innerText = `${totalGeral.toLocaleString()} ${curr}`;
    };

    const addItem = () => {
        const desc = prompt("Descrição do item:");
        if (!desc) return;
        const qty = parseFloat(prompt("Quantidade:", "1")) || 1;
        const price = parseFloat(prompt("Preço Unitário:", "0")) || 0;
        items.push({ desc, qty, price });
        sync();
    };

    const generatePDF = () => {
        if (typeof window.jspdf === 'undefined') {
            alert("As bibliotecas de PDF ainda estão a carregar. Por favor, aguarde um momento.");
            return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.setFont("helvetica", "bold");
        doc.text("FATURA PRÓ-FORMA", 105, 20, { align: "center" });

        doc.autoTable({
            startY: 40,
            head: [['Descrição', 'Qtd', 'Preço Unit.', 'Subtotal']],
            body: items.map(i => [i.desc, i.qty, i.price.toLocaleString(), (i.qty * i.price).toLocaleString()]),
            theme: 'grid',
            headStyles: { fillColor: [15, 23, 42] }
        });

        doc.save(`Fatura_${document.getElementById('iNum').value}.pdf`);
    };

    // Eventos
    document.getElementById('btnAdd').onclick = addItem;
    document.getElementById('btnExport').onclick = generatePDF;
    document.querySelectorAll('input, select').forEach(el => el.oninput = sync);

    sync(); // Inicialização
});
</script>
</body>
</html>
