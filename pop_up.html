<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANIELANASOFÁ | Pop-up Termos de Uso</title>
  <style>
    :root {
      --gold: #c9a96e;
      --dark: #151515;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* AJUSTE AQUI: O pop-up começa com display: none */
    .terms-popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.98);
      z-index: 3000;
      display: none; /* Alterado de flex para none */
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .terms-content {
      background: #1f1f1f;
      max-width: 520px;
      width: 100%;
      border-radius: 24px;
      padding: 45px 35px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
    }

    .terms-content h2 {
      color: var(--gold);
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .terms-content p {
      color: #ccc;
      line-height: 1.75;
      margin-bottom: 25px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 30px;
      justify-content: center;
    }

    .checkbox-container input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--gold);
    }

    .checkbox-container label {
      color: #ddd;
      cursor: pointer;
      font-size: 1.05rem;
    }

    .terms-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .terms-btn {
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 160px;
    }

    .terms-btn.accept {
      background: var(--gold);
      color: #151515;
    }
    .terms-btn.accept:hover:not(:disabled) {
      background: #e0c080;
      transform: translateY(-3px);
    }

    .terms-btn.accept:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .terms-btn.read {
      background: transparent;
      color: white;
      border: 2px solid #666;
    }
    .terms-btn.read:hover {
      background: #333;
      border-color: var(--gold);
    }
  </style>
</head>
<body>

  <div class="terms-popup" id="termsPopup">
    <div class="terms-content">
      <h2>Termos de Uso</h2>
      <p>
        Ao continuar navegando no site da <strong>DANIELANASOFÁ</strong>, você concorda com nossos 
        <strong>Termos de Uso</strong>, <strong>Política de Privacidade</strong> 
        e <strong>Política de Reembolso</strong>.
      </p>

      <div class="checkbox-container">
        <input type="checkbox" id="acceptCheckbox">
        <label for="acceptCheckbox">Li e concordo com os termos acima</label>
      </div>

      <div class="terms-buttons">
        <button class="terms-btn read" onclick="window.open('Termos_de_Uso.html', '_blank')">
          Ler os Termos Completos
        </button>
        <button class="terms-btn accept" id="acceptBtn" onclick="acceptTerms()" disabled>
          Aceitar e Continuar
        </button>
      </div>
    </div>
  </div>

  <script>
    const popup = document.getElementById('termsPopup');
    const checkbox = document.getElementById('acceptCheckbox');
    const acceptBtn = document.getElementById('acceptBtn');

    checkbox.addEventListener('change', function() {
      acceptBtn.disabled = !this.checked;
    });

    function showTermsPopup() {
      // Verifica se o item existe no localStorage
      const hasAccepted = localStorage.getItem('termsAccepted');
      
      if (!hasAccepted) {
        popup.style.display = 'flex';
      } else {
        popup.style.display = 'none';
      }
    }

    function acceptTerms() {
      if (checkbox.checked) {
        localStorage.setItem('termsAccepted', 'true');
        popup.style.display = 'none';
        console.log("Termos aceitos e salvos.");
      }
    }

    // Executa a verificação assim que o script carrega
    showTermsPopup();
  </script>

</body>
</html>
