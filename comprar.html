<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANIELANASOFÁ | Finalizar Compra</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles/comprar.css">
  <script src="scripts/comprar.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo"><h2>DANIELANASOFÁ</h2></div>
    <a href="index.html" class="back-store">← Voltar à Loja</a>
  </nav>

  <div class="container">
    <h1 class="title">Finalizar Compra</h1>

    <div id="alertBox" class="alert alert-error"></div>

    <div class="step" id="productStep">
      <div class="step-title"><i class="fas fa-couch"></i> Produto Selecionado</div>
      <div id="summaryBox"></div>
    </div>

    <div class="step" id="methodStep" style="display:none;">
      <div class="step-title"><i class="fas fa-wallet"></i> Método de Aquisição</div>
      <div class="method-selector">
        <div class="method-btn" id="remoteBtn" onclick="selectMethod('remote')">
          <i class="fas fa-truck"></i> Pagamento na Entrega
        </div>
        <div class="method-btn" id="localBtn" onclick="selectMethod('local')">
          <i class="fas fa-credit-card"></i> Comprar Agora
        </div>
      </div>
      <div id="paymentMethods" class="payment-methods">
        <div class="payment-card" onclick="selectPayment(this, 'transfer')"><i class="fas fa-university"></i><br>Transferência</div>
        <div class="payment-card" onclick="selectPayment(this, 'multicaixa')"><i class="fas fa-mobile-alt"></i><br>Express</div>
        <div class="payment-card" onclick="selectPayment(this, 'unitel')"><i class="fas fa-money-bill-wave"></i><br>Unitel Money</div>
        <div class="payment-card" onclick="selectPayment(this, 'paypay')"><i class="fas fa-coins"></i><br>PayPay</div>
      </div>
      <div id="paymentDetails" class="payment-info"></div>
    </div>

    <div class="step" id="formStep" style="display:none;">
      <div class="step-title"><i class="fas fa-address-card"></i> Dados de Faturação</div>
      <form id="checkoutForm" onsubmit="submitToWhatsApp(event)">
        <div class="form-grid">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Nome Completo *</label>
            <input type="text" id="nome" required>
          </div>
          <div class="form-group">
            <label><i class="fab fa-whatsapp"></i> WhatsApp / Telefone *</label>
            <input type="tel" id="telefone" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> E-mail *</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-id-card"></i> NIF / Número de BI *</label>
            <input type="text" id="nif" required>
          </div>
          <div id="addressFields" style="display: none; grid-column: 1 / -1;">
            <div class="form-group">
              <label><i class="fas fa-map-marked-alt"></i> Morada Completa *</label>
              <textarea id="endereco" rows="3"></textarea>
            </div>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label><i class="fas fa-pen-nib"></i> Notas</label>
            <textarea id="observacoes" rows="2"></textarea>
          </div>
        </div>
        <button type="submit" class="submit-btn">
          <i class="fab fa-whatsapp"></i> Confirmar Pedido
        </button>
      </form>
    </div>
  </div>
</body>
</html>
